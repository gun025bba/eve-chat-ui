# Safety net: a push to main must always end up with a `test` run on its commit (release-tag.sh and the release refuse a main commit without one).
# The push event of a merge sometimes does not start the CI workflow (seen on eve-web since 2026-10-29: merges #28, #37, #45 had no run). Every 30 minutes this
# looks at the tip of main and, if no CI run exists for it, starts CI on main by hand (workflow_dispatch) - the same thing that was done manually before.
# Uses only the workflow's own GITHUB_TOKEN (actions: write on this repository); no secret, no personal token.
name: main-ci-sweep
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: main-ci-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start CI on main if its tip has no CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          age=$(( $(date +%s) - $(date -d "$(gh api "repos/$REPO/commits/main" --jq .commit.committer.date)" +%s) ))
          n=$(gh api "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$sha&per_page=1" --jq .total_count)
          echo "main tip $sha, age ${age}s, CI runs on it: $n"
          if [ "$n" = 0 ] && [ "$age" -gt 300 ]; then
            gh workflow run test.yml --repo "$REPO" --ref main
            echo "started CI on main for $sha"
          fi
