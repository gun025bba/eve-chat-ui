# Signed UI release: tag the CURRENT TIP of main as vX.Y.Z (any other commit is refused) -> a CI-signed UI bundle (Sigstore keyless) is published as a GitHub release.
# The Mac installs it with:  /usr/local/libexec/eve/fetch web X.Y.Z && sudo /usr/local/libexec/eve/deploy deploy-web
# The signing workflow lives in the gateway repo (single trust root, referenced at @main, never ./); this repository only calls it. There is no key and no secret here.
# Design and threat model: gun025bba/eve-serving docs/deploy-signing.md. Template: deploy/nopasswd/eve-web-release.yml.example in that repository.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  web:
    permissions:
      contents: write
      id-token: write
    uses: gun025bba/eve-serving/.github/workflows/deploy-sign.yml@main
    with:
      kind: web
