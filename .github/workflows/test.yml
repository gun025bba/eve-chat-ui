name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install Playwright + Chromium + fonts
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          # layout tests are tuned for NanumGothic (Hangul) + Noto Sans (Latin); the runner image prefers WenQuanYi/DejaVu, which are wider
          sudo apt-get remove -y fonts-wqy-zenhei fonts-wqy-microhei || true
          sudo apt-get install -y --no-install-recommends fonts-nanum fonts-noto-core
          sudo fc-cache -f
      - name: Run all suites (mock.py + every tests/*.py + sw_push.js, sequentially)
        env:
          PYTHON: python
          EVE_PORT: '8899'
          TZ: Asia/Seoul
        run: bash tests/run_all.sh
