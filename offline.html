<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>오프라인 · LLM Chat</title>
<style>
:root{color-scheme:dark light;--bg:#000;--l:#fff;--l2:rgba(235,235,245,.6);--a:#0A84FF}
@media (prefers-color-scheme:light){:root{--bg:#fff;--l:#000;--l2:rgba(60,60,67,.6);--a:#007AFF}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--l);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);text-align:center;box-sizing:border-box}
svg{width:56px;height:56px;stroke:var(--l2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}p{margin:0;color:var(--l2);font-size:15px}
button{margin-top:18px;border:0;border-radius:12px;background:var(--a);color:#fff;font:600 17px/1 inherit;padding:14px 28px;transition:transform .1s,opacity .1s}
button:active{transform:scale(.97);opacity:.8}
</style></head><body><main id="offline">
<svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/></svg>
<h1>오프라인 상태입니다</h1><p>서버 또는 Tailscale에 연결할 수 없어요.<br>연결을 확인한 뒤 다시 시도하세요.</p>
<button onclick="location.href='./'">다시 시도</button></main>
<script>addEventListener('online',()=>location.href='./')</script></body></html>
